[package]
name = "cyanotype"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
description = "Records axum integration tests and emits an OpenAPI 3.1 document describing what they exercised."
repository = "https://github.com/plainwuatlig/cyanotype"

[dependencies]
axum = "0.7"
bytes = "1"
http = "1"
http-body = "1"
pin-project-lite = "0.2"
schemars = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tower = { version = "0.4", features = ["util"] }

[dev-dependencies]
http-body-util = "0.1"
tokio = { version = "1", features = ["full"] }
